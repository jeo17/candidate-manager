<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17644e" />
    <meta name="description" content="Folio — a thoughtful workspace for your next great hire." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Folio · Candidates</title>
    <script>
      try {
        const t = localStorage.getItem('folio:theme')
        document.documentElement.dataset.theme =
          t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light'
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
